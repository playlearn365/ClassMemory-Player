<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>ClassMemory Player｜課堂照片格言播放器</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink:    #ff8fab;
      --pink-lt: #ffd6e0;
      --peach:   #ffb347;
      --yellow:  #ffe066;
      --mint:    #a8edcc;
      --sky:     #a0d8f1;
      --purple:  #c9b1ff;
      --bg:      #fff8f0;
      --card:    #ffffff;
      --text:    #4a3f5c;
      --muted:   #9e8fb2;
      --radius:  22px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Nunito', 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* ── floating bubbles bg ── */
    .bubbles {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
    }
    .bubble {
      position: absolute;
      border-radius: 50%;
      opacity: 0.18;
      animation: drift linear infinite;
    }
    @keyframes drift {
      0%   { transform: translateY(110vh) scale(1); }
      100% { transform: translateY(-20vh) scale(1.1); }
    }

    .page {
      position: relative; z-index: 1;
      max-width: 980px;
      margin: 0 auto;
      padding: 36px 18px 130px;
    }

    /* ── header ── */
    .header {
      text-align: center;
      margin-bottom: 36px;
    }
    .logo-emoji {
      font-size: 56px;
      display: block;
      animation: bounce 2s ease-in-out infinite;
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }
    h1 {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--pink) 0%, var(--peach) 50%, var(--purple) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 8px 0 6px;
    }
    .subtitle {
      font-size: 15px;
      color: var(--muted);
      font-weight: 600;
    }

    /* ── progress dots ── */
    .step-dots {
      display: flex; justify-content: center; gap: 10px; margin-bottom: 28px;
    }
    .step-dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--pink-lt);
    }
    .step-dot.active { background: var(--pink); box-shadow: 0 0 0 4px rgba(255,143,171,0.25); }

    /* ── grid ── */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 22px;
    }
    @media (min-width: 720px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }

    /* ── card ── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 8px 32px rgba(180,130,200,0.12), 0 2px 8px rgba(0,0,0,0.04);
      border: 2.5px solid transparent;
      background-clip: padding-box;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: -2.5px;
      border-radius: calc(var(--radius) + 2.5px);
      background: linear-gradient(135deg, var(--pink-lt), var(--sky), var(--mint));
      z-index: -1;
    }

    .card-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .card-title .step-badge {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pink), var(--peach));
      color: white;
      font-size: 13px;
      font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    /* ── upload area ── */
    .upload-area {
      position: relative;
      border-radius: 16px;
      border: 3px dashed var(--pink-lt);
      padding: 28px 14px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s;
      background: linear-gradient(135deg, #fff5f8 0%, #f5f8ff 100%);
    }
    .upload-area:hover {
      border-color: var(--pink);
      background: linear-gradient(135deg, #ffe4ec 0%, #eef3ff 100%);
      transform: scale(1.01);
    }
    .upload-area input {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }
    .upload-icon { font-size: 38px; }
    .upload-label {
      display: block;
      margin-top: 8px;
      font-weight: 700;
      font-size: 15px;
      color: var(--pink);
    }
    .upload-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── thumbs ── */
    .thumbs {
      margin-top: 14px;
      max-height: 230px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      padding-right: 2px;
    }
    .thumbs::-webkit-scrollbar { width: 5px; }
    .thumbs::-webkit-scrollbar-track { background: #f5e6ff; border-radius: 10px; }
    .thumbs::-webkit-scrollbar-thumb { background: var(--purple); border-radius: 10px; }

    .thumb {
      position: relative;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid transparent;
      background: #f0e6ff;
      transition: transform 0.15s;
    }
    .thumb:hover { transform: scale(1.06); }
    .thumb.has-quote {
      border-color: var(--yellow);
      box-shadow: 0 0 0 2px rgba(255,224,102,0.5);
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-index {
      position: absolute; left: 4px; bottom: 4px;
      background: rgba(255,255,255,0.85);
      color: var(--text);
      font-size: 10px; font-weight: 800;
      padding: 1px 5px;
      border-radius: 6px;
    }

    /* ── music panel ── */
    .music-panel {
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, #fff0f8, #f0f4ff);
      border: 2px solid var(--pink-lt);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 18px;
    }
    .music-icon { font-size: 26px; animation: spin-slow 4s linear infinite; }
    @keyframes spin-slow {
      0%,100% { transform: rotate(-5deg); }
      50%      { transform: rotate(5deg); }
    }
    .music-status { font-size: 13px; color: var(--muted); font-weight: 700; }
    .music-status.ok    { color: #3dba7b; }
    .music-status.error { color: #e06b6b; }

    /* ── labels & inputs ── */
    .field { margin-bottom: 14px; }
    .field label {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      display: block;
      margin-bottom: 5px;
    }
    .field label .lbl-badge {
      display: inline-block;
      background: var(--yellow);
      color: #6b5200;
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 20px;
      margin-left: 6px;
      font-weight: 800;
    }
    textarea, .text-input {
      width: 100%;
      background: #fdf8ff;
      border-radius: 12px;
      border: 2px solid #e8dff5;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
      font-family: 'Nunito', 'Noto Sans TC', sans-serif;
      font-weight: 600;
      outline: none;
      transition: border-color 0.2s;
      resize: none;
    }
    textarea:focus, .text-input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(201,177,255,0.2);
    }

    /* ── buttons ── */
    .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }

    .btn {
      border: none;
      border-radius: 50px;
      padding: 14px 20px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      transition: all 0.2s;
      font-family: 'Nunito', 'Noto Sans TC', sans-serif;
      letter-spacing: 0.3px;
    }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.06); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn.loading { opacity: 0.7; cursor: wait; }

    .btn-preview {
      background: linear-gradient(135deg, var(--sky) 0%, var(--purple) 100%);
      color: white;
      box-shadow: 0 6px 18px rgba(160,216,241,0.45);
    }
    .btn-export {
      background: linear-gradient(135deg, var(--pink) 0%, var(--peach) 100%);
      color: white;
      box-shadow: 0 6px 18px rgba(255,143,171,0.45);
    }
    .btn-pink {
      background: linear-gradient(135deg, #ff6eaf 0%, #ff9a44 100%);
      color: white;
      box-shadow: 0 6px 20px rgba(255,110,175,0.4);
      display: flex;
      text-decoration: none;
    }

    /* ── mobile hint ── */
    .mobile-hint {
      margin-top: 14px;
      padding: 12px 14px;
      background: #fff9e6;
      border: 2px solid var(--yellow);
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      color: #6b5200;
      line-height: 1.7;
    }
    .mobile-hint strong { color: #d97706; }

    /* ── photo count pill ── */
    .count-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: linear-gradient(135deg, var(--pink), var(--peach));
      color: white;
      border-radius: 20px;
      padding: 2px 12px;
      font-size: 13px;
      font-weight: 800;
      margin-left: 6px;
    }

    /* ── player overlay ── */
    #playerView {
      position: fixed;
      inset: 0;
      background: #000;
      color: white;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      flex-direction: column;
    }
    #playerView.show { display: flex; }
    #playerImageWrapper {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 1200px;
      max-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #playerImage {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: opacity 0.4s;
    }
    .quote-layer {
      position: absolute;
      bottom: 0; width: 100%;
      padding-bottom: 90px;
      background: linear-gradient(to top, rgba(0,0,0,0.82), transparent);
      text-align: center;
      display: flex;
      justify-content: center;
    }
    .quote-box {
      background: rgba(0,0,0,0.55);
      padding: 15px 34px;
      border-radius: 16px;
      backdrop-filter: blur(6px);
      border: 1.5px solid rgba(255,255,255,0.15);
    }
    .quote-box h1 {
      margin: 0;
      background: linear-gradient(135deg, #ffe066, #ffd6e0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: 24px;
      font-weight: 900;
      font-family: 'Nunito', 'Noto Sans TC', sans-serif;
    }
    .controls {
      position: absolute;
      bottom: 28px;
      display: flex;
      gap: 16px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 10px 28px;
      border-radius: 50px;
    }
    .c-btn {
      background: none;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .c-btn:hover { transform: scale(1.25); }

    /* ── decorative stars ── */
    .deco {
      position: fixed; pointer-events: none; z-index: 0;
      font-size: 24px; opacity: 0.25;
      animation: twinkle 3s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%,100% { opacity: 0.18; transform: scale(1) rotate(0deg); }
      50%      { opacity: 0.35; transform: scale(1.2) rotate(15deg); }
    }
  </style>
</head>
<body>

<!-- Bubbles -->
<div class="bubbles" id="bubblesContainer"></div>

<!-- Decorative stars -->
<div class="deco" style="top:8%;left:4%;animation-delay:0s">⭐</div>
<div class="deco" style="top:20%;right:5%;animation-delay:0.8s">🌸</div>
<div class="deco" style="top:55%;left:2%;animation-delay:1.5s">🌈</div>
<div class="deco" style="top:72%;right:3%;animation-delay:0.4s">✨</div>
<div class="deco" style="top:88%;left:7%;animation-delay:2s">🎀</div>
<div class="deco" style="top:38%;right:2%;animation-delay:1.1s">🦋</div>

<div class="page" id="setupView">

  <!-- Header -->
  <div class="header">
    <span class="logo-emoji">📸</span>
    <h1>ClassMemory Player</h1>
    <p class="subtitle">老師的課堂回憶相簿，輕鬆製作、美美送給家長 🎁</p>
  </div>

  <div class="step-dots">
    <div class="step-dot active"></div>
    <div class="step-dot active"></div>
    <div class="step-dot"></div>
  </div>

  <div class="grid">

    <!-- Card 1: Photos -->
    <div class="card">
      <div class="card-title">
        <span class="step-badge">1</span>
        上傳照片
        <span class="count-pill">📷 <span id="photoCount">0</span> 張</span>
      </div>

      <div class="upload-area">
        <div class="upload-icon">🖼️</div>
        <span class="upload-label">點這裡選擇照片</span>
        <span class="upload-sub">支援 JPG / PNG，可一次選多張</span>
        <input type="file" id="photoInput" accept="image/*" multiple />
      </div>

      <div id="thumbs" class="thumbs"></div>
    </div>

    <!-- Card 2: Settings -->
    <div class="card">
      <div class="card-title">
        <span class="step-badge">2</span>
        設定與匯出
      </div>

      <!-- Music -->
      <div class="music-panel">
        <span class="music-icon">🎵</span>
        <div id="musicStatus" class="music-status">⏳ 正在載入音樂 (music.mp3)…</div>
      </div>

      <!-- Quotes -->
      <div class="field">
        <label>格言 <span class="lbl-badge">第 1 張</span></label>
        <textarea id="q1" rows="1">好的開始是成功的一半</textarea>
      </div>
      <div class="field">
        <label>格言 <span class="lbl-badge">第 5 張</span></label>
        <textarea id="q2" rows="1">休息是為了走更長遠的路</textarea>
      </div>
      <div class="field">
        <label>格言 <span class="lbl-badge">第 10 張</span></label>
        <textarea id="q3" rows="1">學而不思則罔，思而不學則殆</textarea>
      </div>

      <!-- File name -->
      <div class="field">
        <label>下載檔名 <span class="lbl-badge">建議英文</span></label>
        <input id="fileName" class="text-input" placeholder="例如：xiao1" />
      </div>

      <div class="btn-group">
        <button class="btn btn-preview" onclick="startPreview()">▶ 線上預覽</button>
        <button class="btn btn-export" id="exportBtn" onclick="exportForParents()">💾 下載給家長</button>
      </div>

      <div id="downloadArea" style="margin-top:12px;"></div>
    </div>

  </div>
</div>

<!-- Player -->
<div id="playerView">
  <div id="playerImageWrapper">
    <img id="playerImage" src="" />
    <div class="quote-layer" id="quoteLayer" style="display:none">
      <div class="quote-box"><h1 id="quoteText"></h1></div>
    </div>
  </div>
  <audio id="bgmPlayer" loop></audio>
  <div class="controls">
    <button class="c-btn" onclick="closePlayer()">✕</button>
    <button class="c-btn" onclick="togglePlay()" id="ppBtn">❚❚</button>
  </div>
</div>

<script>
// ── Bubble generator ──
(function() {
  const colors = ['#ffb3c6','#ffd6a5','#caffbf','#a9def9','#e0aaff','#ffc8dd'];
  const container = document.getElementById('bubblesContainer');
  for (let i = 0; i < 18; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 40 + Math.random() * 120;
    b.style.cssText = `
      width:${size}px; height:${size}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      left:${Math.random()*100}%;
      animation-duration:${10+Math.random()*18}s;
      animation-delay:${-Math.random()*20}s;
    `;
    container.appendChild(b);
  }
})();

// ── Core vars ──
const MUSIC_FILE_NAME = 'music.mp3';
let bgmBlobUrl = null;
let bgmBase64 = null;
const ua = navigator.userAgent.toLowerCase();
const isMobile = /iphone|ipad|ipod|android/.test(ua);
const isIOS = /iphone|ipad|ipod/.test(ua);

const photoInput  = document.getElementById('photoInput');
const thumbs      = document.getElementById('thumbs');
const photoCount  = document.getElementById('photoCount');
const musicStatus = document.getElementById('musicStatus');
const exportBtn   = document.getElementById('exportBtn');
const downloadArea= document.getElementById('downloadArea');
const playerView  = document.getElementById('playerView');
const bgmPlayer   = document.getElementById('bgmPlayer');
const playerImage = document.getElementById('playerImage');
const quoteLayer  = document.getElementById('quoteLayer');
const quoteText   = document.getElementById('quoteText');
const ppBtn       = document.getElementById('ppBtn');

let photos = [], slides = [], idx = 0, timer = null, isPlaying = false;

// ── 1. Load music ──
async function loadMusic() {
  try {
    const response = await fetch(MUSIC_FILE_NAME).catch(() => null);
    if (!response || !response.ok) throw new Error("not found");
    const blob = await response.blob();
    bgmBlobUrl = URL.createObjectURL(blob);
    bgmPlayer.src = bgmBlobUrl;
    const reader = new FileReader();
    reader.onloadend = () => {
      bgmBase64 = reader.result;
      musicStatus.innerHTML = `✅ 音樂已就緒 🎶`;
      musicStatus.className = "music-status ok";
    };
    reader.readAsDataURL(blob);
  } catch {
    musicStatus.innerHTML = `⚠️ 找不到 <b>${MUSIC_FILE_NAME}</b><br><span style="font-size:11px">上傳到 GitHub 同目錄後即可使用</span>`;
    musicStatus.className = "music-status error";
  }
}
window.addEventListener('DOMContentLoaded', loadMusic);

// ── 2. Photos ──
photoInput.addEventListener('change', function(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  let count = 0;
  files.forEach(f => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        let w = img.width, h = img.height;
        const max = 1000;
        if (w > max || h > max) { const r = Math.min(max/w, max/h); w*=r; h*=r; }
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        photos.push({ src: c.toDataURL('image/jpeg', 0.8) });
        count++;
        if (count === files.length) renderThumbs();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(f);
  });
  photoInput.value = '';
});

function renderThumbs() {
  photoCount.innerText = photos.length;
  thumbs.innerHTML = photos.map((p, i) => `
    <div class="thumb ${(i===0||i===4||i===9)?'has-quote':''}">
      <img src="${p.src}">
      <span class="thumb-index">${i+1}</span>
    </div>
  `).join('');
}

// ── 3. Player ──
function getSlides() {
  const q1 = document.getElementById('q1').value;
  const q2 = document.getElementById('q2').value;
  const q3 = document.getElementById('q3').value;
  return photos.map((p, i) => {
    let t = "";
    if (i===0) t=q1; if (i===4) t=q2; if (i===9) t=q3;
    return { src: p.src, txt: t };
  });
}

function startPreview() {
  if (!photos.length) { alert("請先上傳照片！"); return; }
  slides = getSlides(); idx = 0;
  document.getElementById('setupView').style.display = 'none';
  playerView.classList.add('show');
  isPlaying = true;
  renderSlide();
  bgmPlayer.play().catch(()=>{});
  ppBtn.innerText = "❚❚";
  startTimer();
}

function closePlayer() {
  isPlaying = false; clearInterval(timer);
  bgmPlayer.pause(); bgmPlayer.currentTime = 0;
  playerView.classList.remove('show');
  document.getElementById('setupView').style.display = 'block';
}

function renderSlide() {
  const s = slides[idx];
  playerImage.src = s.src;
  if (s.txt) { quoteText.innerText = s.txt; quoteLayer.style.display = 'flex'; }
  else { quoteLayer.style.display = 'none'; }
}

function next() {
  if (idx < slides.length - 1) { idx++; renderSlide(); }
  else { isPlaying = false; clearInterval(timer); bgmPlayer.pause(); ppBtn.innerText = '▶'; }
}

function togglePlay() {
  isPlaying = !isPlaying;
  ppBtn.innerText = isPlaying ? '❚❚' : '▶';
  if (isPlaying) { bgmPlayer.play(); startTimer(); }
  else { bgmPlayer.pause(); clearInterval(timer); }
}

function startTimer() { clearInterval(timer); timer = setInterval(next, 4000); }

// ── 4. Export ──
function exportForParents() {
  if (!photos.length) { alert("沒有照片可以匯出！"); return; }
  if (!bgmBase64) {
    if (!confirm("⚠️ 沒有偵測到 music.mp3，匯出的檔案將沒有聲音。\n確定要繼續嗎？")) return;
  }
  exportBtn.innerText = "⏳ 打包中…";
  exportBtn.classList.add("loading");
  exportBtn.disabled = true;

  setTimeout(() => {
    const rawName = document.getElementById('fileName').value.trim() || 'ClassMemory';
    const safeBase = rawName.replace(/[^a-zA-Z0-9_\u4e00-\u9fa5-]/g,"_") || "ClassMemory";
    const safeName = safeBase.endsWith(".html") ? safeBase : safeBase + ".html";
    const slidesData = JSON.stringify(getSlides());
    const musicData = bgmBase64 || "";

    const finalHtml = `<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${safeName}</title>
<style>
body{margin:0;background:#000;height:100vh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;display:flex;justify-content:center;align-items:center}
img{max-width:100%;max-height:100%;object-fit:contain;transition:opacity .5s}
.q{position:absolute;bottom:0;width:100%;padding:40px 20px 80px;background:linear-gradient(to top,#000000cc,transparent);text-align:center;display:none}
.box{background:#00000099;padding:15px 30px;border-radius:15px;display:inline-block;backdrop-filter:blur(5px)}
h1{background:linear-gradient(135deg,#ffe066,#ffd6e0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:0;font-size:24px}
#btn{position:absolute;z-index:10;background:linear-gradient(135deg,#ff8fab,#ffb347);color:#fff;border:none;padding:15px 44px;border-radius:50px;font-size:20px;font-weight:800;cursor:pointer;box-shadow:0 6px 20px rgba(255,143,171,0.5);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;}
#hint{position:absolute;top:10px;left:0;right:0;color:#e5e7eb;font-size:13px;text-align:center;padding:0 16px;line-height:1.5;background:rgba(0,0,0,0.5);pointer-events:none;}
</style>
</head>
<body>
<div id="hint">📌 若按鈕沒反應，請在瀏覽器右上角選「以 Chrome / Safari 開啟」再試一次。</div>
<button id="btn" onclick="start()">▶ 開始播放回顧</button>
<img id="img">
<div id="q" class="q"><div class="box"><h1 id="qt"></h1></div></div>
<script>
const S=${slidesData};
const M="${musicData}";
let i=0,t;
const a=M?new Audio(M):null;
if(a){a.loop=true;}
const img=document.getElementById('img');
const q=document.getElementById('q');
const qt=document.getElementById('qt');
const btn=document.getElementById('btn');
const hint=document.getElementById('hint');
setTimeout(()=>{if(hint)hint.style.display='none'},5000);
function start(){
  btn.style.display='none';
  if(hint)hint.style.display='none';
  if(a){a.play().catch(e=>console.log(e));}
  show();
  t=setInterval(next,4000);
}
function show(){const s=S[i];img.src=s.src;if(s.txt){qt.innerText=s.txt;q.style.display='block';}else{q.style.display='none';}}
function next(){if(i<S.length-1){i++;show();}else{clearInterval(t);if(a){a.pause();}btn.innerText='↺ 重看一次';btn.style.display='block';i=0;}}
<\/script>
</body>
</html>`;

    let url;
    if (isMobile) {
      url = "data:text/html;charset=utf-8," + encodeURIComponent(finalHtml);
    } else {
      const blob = new Blob([finalHtml], { type: "text/html" });
      url = URL.createObjectURL(blob);
    }

    downloadArea.innerHTML = "";

    if (!isMobile) {
      const autoLink = document.createElement("a");
      autoLink.href = url; autoLink.download = safeName;
      document.body.appendChild(autoLink); autoLink.click(); document.body.removeChild(autoLink);
    }

    const manualBtn = document.createElement("a");
    manualBtn.href = url;
    manualBtn.className = "btn btn-pink";
    manualBtn.innerHTML = `📥 點此下載：${safeName}`;
    if (!isMobile) {
      manualBtn.download = safeName;
    } else {
      manualBtn.target = "_blank";
      manualBtn.addEventListener("click", () => {
        if (isIOS) {
          setTimeout(() => {
            alert("iPhone 使用步驟：\n\n1. 會開啟新畫面。\n2. 下方按「分享」圖示（⬆️）。\n3. 選「儲存到檔案」。");
          }, 800);
        }
      });
    }

    const mobileHint = document.createElement("div");
    mobileHint.className = "mobile-hint";
    mobileHint.innerHTML = `
      <strong>📱 手機下載教學：</strong><br>
      1. 點擊上方的<strong>粉紅色按鈕</strong>。<br>
      2. <strong>iPhone (Safari)</strong>：點下方「分享」📤 →「儲存到檔案」。<br>
      3. <strong>Android</strong>：通常會直接下載或出現下載提醒。<br>
      4. <strong>LINE/FB 內建瀏覽器</strong>：點右上角選單 →「用 Chrome/Safari 開啟」。`;

    downloadArea.appendChild(manualBtn);
    downloadArea.appendChild(mobileHint);

    exportBtn.innerText = "💾 下載給家長";
    exportBtn.classList.remove("loading");
    exportBtn.disabled = false;
  }, 400);
}
</script>
</body>
</html>
